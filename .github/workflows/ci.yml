name: CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: |
          python --version
          which python
          python -c "import sys; print('Executable:', sys.executable)"

      - name: Run tests (unittest)
        run: |
          python -m unittest discover -v

  test-legacy:
    name: Tests (Python 2.7 via container)
    runs-on: ubuntu-latest
    container:
      image: python:2.7
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install package
        run: |
          pip install --upgrade pip setuptools
          pip install .
      - name: Run tests (unittest)
        run: |
          python -m unittest discover -v || true
      - name: Legacy note
        run: echo "Python 2.7 run completed (non-blocking)."

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [tests, test-legacy]
    if: always()
    steps:
      - name: Aggregate result
        run: |
          echo "Modern matrix + legacy (2.7) complete. Check job logs for details."
